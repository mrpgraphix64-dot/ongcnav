# ONGC Navratri Production Nginx Reverse Proxy Configuration
# Optimized for sub-50ms turnstile QR scanning and high-concurrency festival traffic

upstream nestjs_api {
    server 127.0.0.1:3001;
    keepalive 64;
}

upstream nextjs_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name ongcnavratri.reworkzone.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ongcnavratri.reworkzone.in;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/ongcnavratri.reworkzone.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ongcnavratri.reworkzone.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Turnstile Fast-Path Checkin Endpoint (<50ms target)
    location /scanner/checkin {
        proxy_pass http://nestjs_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for instant response
        proxy_buffering off;
        proxy_read_timeout 5s;
        proxy_connect_timeout 2s;
    }

    # API Backend Routes
    location ~ ^/(api|admin|auth|public|scanner) {
        proxy_pass http://nestjs_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        client_max_body_size 10M;
    }

    # Next.js Static Assets Caching
    location /_next/static/ {
        proxy_pass http://nextjs_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js Frontend
    location / {
        proxy_pass http://nextjs_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
