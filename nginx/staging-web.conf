# ONGC Navratri — STAGING Next.js frontend reverse proxy.
#
# Permanent staging web deployment, replacing the earlier temporary
# HTTP-only smoke-test setup (which used port 8080 and has been removed).
# This is a separate file and a separate domain/port pairing from
# nginx/staging-api.conf (which already owns port 80 for the raw staging
# IP) — this file listens on port 80 for the ongcnavratri.reworkzone.in
# hostname specifically, so both can coexist on the same VPS via
# name-based virtual hosting.
#
# Does not touch production Nginx config (nginx.conf) or the production
# domain in any way, and does not touch the production Laravel
# application.
#
# HTTPS intentionally NOT configured yet — DNS for this hostname has not
# been finalized. Once it is, run:
#   sudo certbot --nginx -d ongcnavratri.reworkzone.in
# which rewrites this file in place to add the HTTPS server block and the
# HTTP -> HTTPS redirect, same pattern as nginx/staging-api.conf.
#
# ------------------------------------------------------------------------
# Deploy steps (VPS)
# ------------------------------------------------------------------------
# 1. sudo cp nginx/staging-web.conf /etc/nginx/sites-available/ongcnavratri-staging-web
# 2. sudo ln -s /etc/nginx/sites-available/ongcnavratri-staging-web /etc/nginx/sites-enabled/
# 3. sudo nginx -t && sudo systemctl reload nginx
#
# If a symlink/file from the abandoned temporary setup still exists,
# remove it first (it used a different filename/port, so it won't
# conflict, but it has no reason to stay):
#   sudo rm -f /etc/nginx/sites-enabled/ongcnavratri-staging-web-temp
#   sudo rm -f /etc/nginx/sites-available/ongcnavratri-staging-web-temp

upstream ongc_web_staging {
    server 127.0.0.1:3012;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ongcnavratri.reworkzone.in;

    # Long-cache static Next.js assets, same pattern as production nginx.conf.
    location /_next/static/ {
        proxy_pass http://ongc_web_staging;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://ongc_web_staging;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        client_max_body_size 10M;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
