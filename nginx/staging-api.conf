# ONGC Navratri — STAGING Nginx reverse proxy (API only).
#
# Next.js stays on Hostinger Web App per the deployment brief — this file
# only proxies the NestJS API. It is intentionally separate from the
# production nginx.conf at the repo root and must never replace it.
#
# ------------------------------------------------------------------------
# PLACEHOLDER DOMAIN — replace before use
# ------------------------------------------------------------------------
# `staging-api.YOUR-DOMAIN.example` below is a placeholder. Replace every
# occurrence with the real staging API hostname once it's decided. Do not
# reuse the production hostname (ongcnavratri.reworkzone.in).
#
# ------------------------------------------------------------------------
# Deploy order (this file has no SSL block yet on purpose)
# ------------------------------------------------------------------------
# 1. Replace the placeholder hostname below.
# 2. Copy this file to /etc/nginx/sites-available/ongcnavratri-staging
# 3. sudo ln -s /etc/nginx/sites-available/ongcnavratri-staging /etc/nginx/sites-enabled/
# 4. sudo nginx -t && sudo systemctl reload nginx     (passes with plain HTTP — no cert exists yet)
# 5. sudo certbot --nginx -d staging-api.YOUR-DOMAIN.example
#    Certbot rewrites this file in place to add the HTTPS server block and
#    the HTTP -> HTTPS redirect (the same pattern already used in the
#    project's production nginx.conf). Don't hand-write the SSL block
#    yourself before the certificate exists — nginx -t will fail on a
#    missing cert path.

upstream ongc_api_staging {
    server 127.0.0.1:3011;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging-api.YOUR-DOMAIN.example;

    # Health check must be reachable over plain HTTP too, for simple
    # uptime probes that don't want to deal with TLS.
    location /health {
        proxy_pass http://ongc_api_staging;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://ongc_api_staging;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        client_max_body_size 10M;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}

# --------------------------------------------------------------------------
# After running certbot (step 5 above), this file will have a second
# server block added automatically, similar to this shape — kept here
# commented out purely for reference, not for manual use:
#
# server {
