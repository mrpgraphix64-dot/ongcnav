name: Deploy Staging

# STAGING ONLY. This workflow never touches the production directory,
# production PM2 processes, or the production Nginx site. It deploys both
# the NestJS API (apps/api) AND the Next.js web app (apps/web) to a
# separate staging directory on the VPS (see docs/STAGING_DEPLOYMENT.md).
#
# The API is deployed in place (rebuilt directly in the staging directory,
# same as always). The web app is deployed as an independent, atomic
# release: deploy/staging-deploy.sh builds a brand-new copy under
# releases-web/<release-id>/, verifies it (including a local smoke test)
# BEFORE switching any traffic to it, then atomically repoints the
# current-web symlink and reloads PM2 — it never rebuilds in place
# underneath the process serving live traffic. RELEASE_ID (this workflow's
# commit SHA) is passed to that script below so each release is named
# after the exact commit it was built from.
#
# Deployment mechanism: the runner checks out the exact commit being
# deployed and rsyncs it over SSH straight into the VPS staging directory
# (excluding node_modules/dist/.next/.env/etc — nothing built or secret
# ever leaves the VPS or gets overwritten by this transfer). This makes
# the workflow itself responsible for getting the right commit onto the
# VPS, so deploy/staging-deploy.sh no longer needs git access on the VPS
# and works correctly even when the staging directory starts out empty
# (first deployment).
#
# The pre-deploy backup lives at $STAGING_DEPLOY_DIR/.backup — inside the
# staging directory itself, not next to it — because the deploy user
# (ongcdeploy) owns that directory but not its parent (/var/www), and this
# pipeline never uses sudo.

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

env:
  STAGING_DEPLOY_DIR: /var/www/ongcnavratri-staging

jobs:
  build-and-verify:
    name: Build & verify (fails fast before touching the VPS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The repo's root .npmrc sets ignore-scripts=true (deliberate
      # supply-chain hardening), which also skips bcrypt's own install
      # script — the thing that fetches/builds its native binary. npm ci
      # succeeds either way, but api tests then fail with "Cannot find
      # module .../bcrypt_lib.node". deploy/staging-deploy.sh already
      # handles this the same way for the actual VPS deploy; CI needs the
      # identical explicit, narrowly-scoped rebuild before running tests.
      - name: Rebuild bcrypt's native binary (skipped by npm ci due to ignore-scripts=true)
        run: npm rebuild bcrypt --workspace=apps/api --ignore-scripts=false

      - name: Build shared-types
        run: npm run build:types

      - name: Build API
        run: npm run build:api

      # NEXT_PUBLIC_API_URL is baked into the browser bundle at build time
      # (it's a Next.js public env var, not read at runtime), so it must be
      # set here, not just on the server. Not a secret — a plain env var,
      # not a GitHub Secret. HTTPS staging API domain (DNS/SSL finalized).
      - name: Build web
        env:
          NEXT_PUBLIC_API_URL: https://api-ongcnavratri.reworkzone.in
        run: npm run build:web

      - name: Run API tests
        run: npm run test:api

  deploy:
    name: Deploy to staging VPS
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout (exact commit being deployed)
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      # The backup lives INSIDE the staging directory (.backup), not as a
      # sibling (staging-dir.backup) — ongcdeploy owns the staging directory
      # itself but not its parent (/var/www), so a sibling path fails with
      # "Permission denied" the moment there's an existing release to back
      # up. Building it with rsync (excluding any previous .backup/.backup.new
      # from the copy) avoids the self-referential-copy problem of `cp -a`
      # a directory into its own subdirectory.
      - name: Back up current release on VPS (no-op on first deployment)
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            DIR="${{ env.STAGING_DEPLOY_DIR }}"
            BACKUP="$DIR/.backup"
            if [ -d "$DIR" ] && [ -n "$(find "$DIR" -mindepth 1 -maxdepth 1 ! -name .backup ! -name .backup.new 2>/dev/null)" ]; then
              rm -rf "$BACKUP.new"
              mkdir -p "$BACKUP.new"
              rsync -a --exclude=".backup" --exclude=".backup.new" "$DIR"/ "$BACKUP.new"/
              rm -rf "$BACKUP"
              mv "$BACKUP.new" "$BACKUP"
              echo "Backup created at $BACKUP (includes built node_modules/dist so rollback does not need to rebuild)."
            else
              echo "Staging directory is empty or has no release yet — first deployment, nothing to back up."
            fi
          '

      # Excludes are deliberate:
      # - node_modules / dist / .next: built on the VPS itself, never shipped over the wire
      # - .env / .env.*: real secrets live only on the VPS, created manually, never in git or this transfer
      # - .git / .github: not needed to run the app
      # - coverage / *.log / logs: local test & log artifacts
      # - .backup / .backup.new: the VPS-side release backup lives inside this
      #   same directory (see the backup step above) — it must never be
      #   touched by this sync, now or if --delete is reintroduced later
      #
      # NOTE: intentionally NOT using --delete for now. Without it, rsync
      # only adds/updates files and never removes anything from the VPS
      # side, which is safer while this pipeline is still unproven against
      # the real staging directory (nothing gets deleted if an exclude
      # pattern is wrong, etc.). The tradeoff: a file removed from the repo
      # will keep lingering on the VPS until manually cleaned up or --delete
      # is reintroduced later once the pipeline has a track record. Revisit
      # this once a few deployments have gone cleanly.
      - name: Sync repository to VPS
        run: |
          rsync -az \
            -e "ssh -p ${{ secrets.VPS_PORT }}" \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '.next' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'coverage' \
            --exclude 'logs' \
            --exclude '*.log' \
            --exclude '.backup' \
            --exclude '.backup.new' \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.STAGING_DEPLOY_DIR }}/"

      - name: Run deployment steps on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            cd /var/www/ongcnavratri-staging
            RELEASE_ID="${{ github.sha }}" bash deploy/staging-deploy.sh

      - name: Roll back to previous release on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: false
          script: |
            cd /var/www/ongcnavratri-staging || exit 1
            bash deploy/staging-rollback.sh

      - name: Verify staging health endpoint externally
        if: always()
        run: |
          # Runs from the GitHub-hosted runner against the public staging
          # URL, independent of the VPS-local health check already done
          # inside staging-deploy.sh / staging-rollback.sh. Reports the
          # final live state whether the deploy succeeded or was rolled
          # back. STAGING_HEALTH_URL is optional: skipped gracefully if
          # not yet configured (e.g. before DNS/SSL exist for staging).
          if [ -z "${{ secrets.STAGING_HEALTH_URL }}" ]; then
            echo "STAGING_HEALTH_URL secret not set, skipping external health check."
            exit 0
          fi
          for i in $(seq 1 5); do
            if curl -fsS -m 5 "${{ secrets.STAGING_HEALTH_URL }}" | grep -q '"status":"ok"'; then
              echo "External health check passed."
              exit 0
            fi
            echo "Attempt $i/5 failed, retrying in 3s..."
            sleep 3
          done
          echo "External health check failed after 5 attempts."
          exit 1
